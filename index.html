    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 全局動態科幻網格背景 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #060911;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(31, 111, 235, 0.15), transparent 60%),
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 3rem 1.5rem;
            overflow-x: hidden;
        }

        /* ---------------- 超科技感開場動畫 (Intro Overlay) ---------------- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #030509;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.18) 0%, transparent 75%),
                linear-gradient(rgba(18, 26, 41, 0) 50%, rgba(0, 0, 0, 0.7) 50%);
            background-size: 100% 100%, 100% 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 2.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        transform 2.5s cubic-bezier(0.19, 1, 0.22, 1), 
                        filter 2.5s ease,
                        visibility 2.5s;
            text-align: center;
            padding: 2rem;
            user-select: none;
            overflow: hidden;
        }

        .laser-beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f2fe, #58a6ff, transparent);
            box-shadow: 0 0 15px #00f2fe, 0 0 30px #00f2fe;
            animation: scanAnimation 3.5s infinite linear;
        }

        .hud-frame {
            position: relative;
            padding: 2.5rem 3.5rem;
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(6, 12, 24, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.05);
            max-width: 650px;
        }

        .hud-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #00f2fe;
            border-style: solid;
        }
        .tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .tr { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
        .bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
        .br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        #intro-screen.glitching {
            animation: screenGlitch 0.4s ease forwards;
        }

        #intro-screen.hidden {
            opacity: 0;
            transform: scale(1.25) rotate(0.5deg);
            filter: blur(12px) brightness(1.8);
            pointer-events: none;
            visibility: hidden;
        }

        .intro-title {
            font-size: 3.2rem;
            color: #58a6ff;
            letter-spacing: 8px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.6);
            animation: textPulse 3s infinite alternate;
        }

        .intro-subtitle {
            font-size: 1.25rem;
            color: #00f2fe;
            margin-bottom: 2.5rem;
            line-height: 1.8;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .intro-status {
            font-family: monospace;
            font-size: 0.8rem;
            color: #58a6ff;
            margin-bottom: 1.5rem;
            letter-spacing: 1.5px;
            opacity: 0.8;
        }

        .intro-prompt {
            font-size: 1rem;
            color: #ffffff;
            border: 1px solid rgba(0, 242, 254, 0.6);
            background: rgba(0, 242, 254, 0.12);
            padding: 1rem 2.5rem;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            animation: cyberBlink 1.6s infinite ease-in-out;
            display: inline-block;
        }

        /* ---------------- 內部科技介面 ---------------- */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        h1 {
            font-size: 2.8rem;
            color: #f0f6fc;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px rgba(88, 166, 255, 0.5);
        }
        p.subtitle {
            color: #00f2fe;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        p.notice {
            color: #e3b341;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            background: rgba(227, 179, 65, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(227, 179, 65, 0.3);
            display: inline-block;
        }

        /* 分類標籤頁籤樣式 */
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(22, 27, 34, 0.8);
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 0.65rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }
        .tab-btn:hover {
            color: #f0f6fc;
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
        }
        .tab-btn.active {
            color: #00f2fe;
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.15);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }

        /* HUD 斜切角卡片 */
        .card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            padding: 1.6rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.15), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-6px) !important;
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        /* 卡片滑入動畫 */
        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
                filter: brightness(1.5);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
        }

        .container.active .card {
            animation: cardAppear 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .card-header {
            margin-bottom: 0.8rem;
        }
        .card-title {
            font-size: 1.3rem;
            color: #f0f6fc;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .badge-itch {
            background-color: rgba(255, 36, 82, 0.15);
            color: #ff4766;
            border: 1px solid rgba(255, 36, 82, 0.5);
        }
        .badge-github {
            background-color: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.5);
        }
        .badge-project {
            background-color: rgba(163, 113, 247, 0.15);
            color: #d2a8ff;
            border: 1px solid rgba(163, 113, 247, 0.5);
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.6rem;
            margin-bottom: 0.8rem;
        }
        .feature-tag {
            font-size: 0.75rem;
            color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.25);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
            padding-top: 0.6rem;
            border-top: 1px dashed rgba(48, 54, 61, 0.8);
        }
        .tech-badge {
            font-size: 0.7rem;
            font-family: monospace;
            color: #8b949e;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 0.15rem 0.45rem;
            border-radius: 3px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: auto;
        }
        .btn {
            display: block;
            text-align: center;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 0.65rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            background-color: #2ea043;
            box-shadow: 0 0 12px rgba(46, 160, 67, 0.6);
        }
        .btn-apk {
            background-color: #1f6feb;
        }
        .btn-apk:hover {
            background-color: #388bfd;
            box-shadow: 0 0 12px rgba(56, 139, 253, 0.6);
        }
        .btn-project {
            background-color: #8957e5;
        }
        .btn-project:hover {
            background-color: #a371f7;
            box-shadow: 0 0 12px rgba(163, 113, 247, 0.6);
        }
        .btn-detail {
            background-color: rgba(0, 242, 254, 0.12);
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
        }
        .btn-detail:hover {
            background-color: rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }
        .btn-disabled {
            background-color: #161b22;
            color: #6e7681;
            border: 1px solid #30363d;
            cursor: default;
        }

        /* ---------------- 高階彈窗 Modal ---------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            backdrop-filter: blur(0px);
            background: rgba(0, 0, 0, 0);
            transition: opacity 0.3s ease, backdrop-filter 0.3s ease, background 0.3s ease, visibility 0.3s;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            position: relative;
            background: rgba(13, 17, 23, 0.95);
            border: 1px solid #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.35);
            border-radius: 8px;
            width: 100%;
            max-width: 520px;
            padding: 2.2rem;
            opacity: 0;
            transform: scale(0.75) translateY(40px) rotateX(-8deg);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            opacity: 1;
            transform: scale(1) translateY(0) rotateX(0deg);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            color: #ff4766;
        }

        .modal-title {
            font-size: 1.6rem;
            color: #f0f6fc;
            margin-top: 0.4rem;
        }

        .modal-description {
            color: #c9d1d9;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 1.2rem 0;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-left: 3px solid #00f2fe;
            border-radius: 0 4px 4px 0;
        }

        @keyframes scanAnimation {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        @keyframes screenGlitch {
            0% { transform: translate(0); filter: brightness(1); }
            20% { transform: translate(-8px, 4px) skewX(2deg); filter: brightness(2) hue-rotate(90deg); }
            40% { transform: translate(6px, -4px); filter: brightness(1.5) hue-rotate(-90deg); }
            60% { transform: translate(-4px, 2px); filter: brightness(2.5); }
            100% { transform: translate(0); filter: brightness(1); }
        }

        @keyframes textPulse {
            from { text-shadow: 0 0 10px rgba(88, 166, 255, 0.4); }
            to { text-shadow: 0 0 25px rgba(0, 242, 254, 0.8), 0 0 35px rgba(31, 111, 235, 0.6); }
        }

        @keyframes cyberBlink {
            0%, 100% { opacity: 0.5; box-shadow: 0 0 5px rgba(0, 242, 254, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 25px rgba(0, 242, 254, 0.7); }
        }

        footer {
            margin-top: auto;
            padding-top: 3.5rem;
            color: #484f58;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>

        let currentCategory = 'all';

        // 更新分類統計數量
        function updateCounts() {
            document.getElementById('count-all').textContent = projects.length;
            document.getElementById('count-game').textContent = projects.filter(p => p.category === 'game').length;
            document.getElementById('count-project').textContent = projects.filter(p => p.category === 'project').length;
            document.getElementById('count-tool').textContent = projects.filter(p => p.category === 'tool').length;
        }

        // 渲染卡片清單
        function renderCards(filterCategory = 'all') {
            const container = document.getElementById('projects-container');
            container.innerHTML = '';

            const filteredProjects = filterCategory === 'all' 
                ? projects 
                : projects.filter(p => p.category === filterCategory);

            filteredProjects.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${(index % 8) * 0.08}s`;

                const btnClass = item.btnStyle ? `btn ${item.btnStyle}` : 'btn';
                const apkBtn = item.apkUrl 
                    ? `<a href="${item.apkUrl}" download class="btn btn-apk">下載 APK 檔案</a>` 
                    : '';

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge ${item.badgeClass}">${item.badgeText}</span>
                            <h2 class="card-title">${item.title}</h2>
                        </div>
                        <div class="tag-group">
                            ${item.tags.map(t => `<span class="feature-tag">${t}</span>`).join('')}
                        </div>
                        <div class="tech-stack">
                            ${item.techs.map(t => `<span class="tech-badge">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-detail" onclick="openModal(${item.id})">詳細資訊</button>
                        <a href="${item.playUrl}" target="_blank" class="${btnClass}">${item.actionText}</a>
                        ${apkBtn}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 切換頁籤分類
        function switchCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const container = document.getElementById('projects-container');
            container.classList.remove('active');
            
            renderCards(category);

            // 觸發重新進場動畫
            setTimeout(() => {
                container.classList.add('active');
            }, 30);
        }

        // 開場動畫點擊邏輯
        const introScreen = document.getElementById('intro-screen');
        const container = document.getElementById('projects-container');
        let clicked = false;

        introScreen.addEventListener('click', () => {
            if (clicked) return;
            clicked = true;
            introScreen.classList.add('glitching');
            setTimeout(() => {
                introScreen.classList.add('hidden');
                container.classList.add('active');
            }, 300);
        });

        // 彈窗 Modal 控制
        const modalOverlay = document.getElementById('modal-overlay');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalBadge = document.getElementById('modal-badge');
        const modalTitle = document.getElementById('modal-title');
        const modalTags = document.getElementById('modal-tags');
        const modalDesc = document.getElementById('modal-desc');
        const modalActions = document.getElementById('modal-actions');

        function openModal(id) {
            const data = projects.find(p => p.id === id);
            if (!data) return;

            modalBadge.className = `badge ${data.badgeClass}`;
            modalBadge.textContent = data.badgeText;
            modalTitle.textContent = data.title;
            modalDesc.textContent = data.desc;

            modalTags.innerHTML = data.tags
                .map(tag => `<span class="feature-tag">${tag}</span>`)
                .join('');

            const mainBtnClass = data.btnStyle ? `btn ${data.btnStyle}` : 'btn';
            let actionsHTML = `<a href="${data.playUrl}" target="_blank" class="${mainBtnClass}">${data.actionText}</a>`;
            if (data.apkUrl) {
                actionsHTML += `<a href="${data.apkUrl}" download class="btn btn-apk">下載 APK 檔案</a>`;
            } else if (data.category === 'game') {
                actionsHTML += `<span class="btn btn-disabled">建議電腦或瀏覽器開啟</span>`;
            }
            modalActions.innerHTML = actionsHTML;

            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        modalCloseBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal();
        });

        // 初始化頁面
        window.addEventListener('DOMContentLoaded', () => {
            updateCounts();
            renderCards('all');
        });
    </script>
